11-03T11:40","cat":"tech","tags":["动画","JavaScript","物理"],"cover":"358","summary":"按钮回弹、卡片归位，这类「弹一下」的效果，最自然的做法是每一帧模拟一根弹簧。这一章从胡克定律讲起，最后附一个可以拖着玩的实验台。","md":"网页上很多「弹一下」的效果，比如按钮按下去再回弹、卡片拖开再归位，用 CSS 关键帧很难做得自然。更好的办法是每一帧都模拟一根弹簧。\n\n## 为什么不用 ease-out\n\nCSS 的缓动曲线（`ease-out`、`cubic-bezier`）有一个固定的时长：动画开始之前，就已经决定了它要在 300 毫秒内结束。可是真实世界的物体没有「时长」，它们只有**质量**、**弹性**和**阻力**。\n\n用弹簧来做动画有两个好处：\n\n- **可以随时打断**：动画进行到一半时目标变了，弹簧会带着当前的速度转向新目标，不会突然跳一下。\n- **手感统一**：同一组参数用在不同的距离上，看起来都像同一种材质。\n\n## 一根弹簧只需要几行\n\n胡克定律说，弹簧的拉力和偏离平衡位置的距离成正比；再加上一个和速度成正比的阻力，就是阻尼弹簧：\n\n```js\n// 每一帧调用一次，dt 是这一帧经过的秒数\nfunction step(s, target, dt) {\n  const force = -stiffness * (s.x - target) - damping * s.v;\n  s.v += (force / mass) * dt;\n  s.x += s.v * dt;\n}\n```\n\n`stiffness`（刚度）越大，弹簧越「硬」，回弹越快；`damping`（阻尼）越大，晃动越早停下来；`mass`（质量）越大，物体越「重」，起步和刹车都更慢。\n\n## 阻尼比：一个数看懂手感\n\n三个参数调起来容易乱。好在物理学家早就把它们合成了一个数，叫**阻尼比** ζ：\n\n```js\nconst zeta = damping / (2 * Math.sqrt(stiffness * mass));\n```\n\n- ζ \u003c 1：**欠阻尼**，会越过目标再晃回来，也就是「果冻感」。\n- ζ = 1：**临界阻尼**，最快回到原位且不过冲，适合不想让人注意到的动画。\n- ζ > 1：**过阻尼**，慢吞吞地爬回去，像在糖浆里移动。\n\n下面实验台的默认参数是刚度 260、阻尼 14、质量 1，算出来 ζ ≈ 0.43，所以会明显地晃两下。\n\n## 实验台\n\n拖动下面的小球再松手，调一调参数，看看右边的曲线怎么变化：\n\n\u003cdiv class=\"demo\" data-demo=\"spring\">\u003c/div>\n\n> [!tip]\n> 记得给喜欢「减少动态效果」的人留一条退路：检测到 `prefers-reduced-motion` 时，直接跳到终点就好。这个站也是这么做的。\n\n## 小结\n\n弹簧动画的核心只有一行受力公式。把它放进 `requestAnimationFrame` 里，界面就会多出一种「有重量」的手感。下一章写这个站的 ⌘K 索引是怎么做的。\n"},{"slug":"command-palette","title":"做一个 ⌘K 命令面板","date":"2026-11-03T14:05","cat":"tech","tags":["交互","JavaScript","搜索"],"cover":"31","summary":"按下 ⌘K，弹出一个小框，打几个字就能跳到任何地方。这一章拆解模糊搜索的打分方法，附一个可以实时看分数的小实验。","md":"现在很多工具都有一个按 \u003ckbd>⌘\u003c/kbd> \u003ckbd>K\u003c/kbd> 呼出的命令面板：不用记菜单在哪，打几个字就能找到想要的东西。这个站也做了一个，现在就可以按一下试试。\n\n## 它由三部分组成\n\n1. **一张清单**：所有能去的地方和能做的事，每一项有标题、关键词和一个要执行的函数。\n2. **一个打分函数**：根据输入给每一项打分，分数高的排前面。\n3. **键盘操作**：\u003ckbd>↑\u003c/kbd> \u003ckbd>↓\u003c/kbd> 移动，\u003ckbd>Enter\u003c/kbd> 执行，\u003ckbd>Esc\u003c/kbd> 关闭。\n\n清单和键盘都不难，有意思的是打分。\n\n## 模糊匹配：按顺序出现就算\n\n最简单的规则是**子序列匹配**：只要输入的每个字符都能在标题里按顺序找到，就算匹配上。输入 `cfg` 能匹配 `config`，输入「弹动画」能匹配「弹簧动画入门」。\n\n光能匹配还不够，还得分出高低。我用了三条规则：\n\n```js\nfunction fuzzy(query, text) {\n  let qi = 0, score = 0, prev = -2;\n  for (let i = 0; i \u003c text.length && qi \u003c query.length; i++) {\n    if (text[i] !== query[qi]) continue;\n    score += 1;                                  // 匹配到一个字符\n    if (i === prev + 1) score += 5;              // 和上一个字符连在一起\n    if (i === 0 || /[\\s\\-_·]/.test(text[i - 1])) score += 3; // 在词的开头\n    prev = i; qi++;\n  }\n  return qi === query.length ? score - text.length * 0.02 : null;\n}\n```\n\n- **连续匹配加分**：`spring` 连着出现，比 `s…p…r…i…n…g` 散落各处更可能是你要找的。\n- **词首加分**：打 `cp` 时，「**C**ommand **P**alette」应该排在「s**c**ra**p**」前面。\n- **越短越好**：同样匹配上，标题越短，说明匹配得越「纯」。\n\n站里实际用的版本还会从每一个可能的起点各试一次，取分数最高的那次，这样就不会被前面碰巧出现的字母带偏。\n\n## 实验：看看分数\n\n在下面输入点什么，每一项右边会显示得分，命中的字符会高亮：\n\n\u003cdiv class=\"demo\" data-demo=\"fuzzy\">\u003c/div>\n\n> [!note]\n> 中文标题还可以给每一项加上拼音或英文关键词。在这个站的索引里输入 `yejian`，也能找到切换白天和夜间的那一项。\n\n## 一点细节\n\n- 面板打开时把焦点放进输入框，关闭时还给原来的元素，用键盘的人才不会迷路。\n- 列表用 `role=\"listbox\"`，当前项用 `aria-selected` 标出来，读屏软件就能读出来。\n- 结果为空时给一句有用的话，比如「没有找到，换个关键词试试」，而不是一片空白。\n\n一个命令面板写下来不到两百行，却能让整个网站好用一大截，很划算。\n"},{"slug":"palette-from-illustration","title":"从二次元插画里偷颜色","date":"2026-11-03T16:30","cat":"design","tags":["配色","设计","Canvas"],"cover":"110","summary":"好看的插画就是现成的调色盘。这一章讲怎么用 k-means 从一张图里提取主色。挑一张试试，还能把它的颜色当成整个站的主题色。","md":"二次元插画的配色往往很讲究：大面积柔和的底色，一两处高饱和的点缀，再加上干净的高光。与其自己从零调色，不如直接向画师学习，从图里把颜色「偷」出来。\n\n## 颜色是一堆点\n\n把一张图缩小到 64 × 40，就得到两千多个像素。每个像素有红、绿、蓝三个数，可以看成三维空间里的一个点。**提取主色，就是在这团点里找出几个最有代表性的中心。**\n\n## k-means：反复求平均\n\nk-means 是最常用的聚类方法，只有三步：\n\n1. 随便挑 k 个点，当作初始的「颜色中心」。\n2. 每个像素归给离它最近的中心。\n3. 把每个中心挪到它名下所有像素的平均位置，然后回到第 2 步。\n\n重复十来次，中心就基本不动了。每个中心的颜色就是一个主色，名下像素的多少就是这个颜色的占比。\n\n```js\nfor (let iter = 0; iter \u003c 12; iter++) {\n  const sum = centers.map(() => [0, 0, 0, 0]);\n  for (const p of pixels) {\n    const k = nearest(p, centers);   // 找到最近的中心\n    sum[k][0] += p[0]; sum[k][1] += p[1]; sum[k][2] += p[2]; sum[k][3]++;\n  }\n  centers = sum.map((s, i) => s[3] ? [s[0] / s[3], s[1] / s[3], s[2] / s[3]] : centers[i]);\n}\n```\n\n> [!tip]\n> 在 RGB 里算距离，并不完全符合人眼的感受。更讲究的做法是先转换到 OKLab 这样「感知均匀」的色彩空间再聚类。这个站的颜色都用 OKLCH 定义。换主题色的时候，程序只换色相和彩度，明度会自动调到按钮上的白字看得清为止。\n\n## 试试看\n\n挑一张插画，看看它的主色。点击色块可以复制色值，「用作主题色」会把整个站的主题色换成这张图里最鲜艳的那个颜色：\n\n\u003cdiv class=\"demo\" data-demo=\"palette\">\u003c/div>\n\n## 取到颜色之后\n\n把提取出来的颜色全部用上，页面通常会很乱。我的习惯是：\n\n- **最浅的颜色做背景**，再稍微降低一点饱和度。\n- **最鲜艳的颜色做强调色**，只用在按钮、链接和需要被注意到的地方。\n- **最深的颜色做文字**，确认它和背景的对比度够高。\n\n剩下的颜色留给插画自己。毕竟，它们本来就是为那张画服务的。\n"},{"slug":"game-title-screen","title":"给博客做一个游戏标题画面","date":"2026-11-03T19:48","cat":"design","tags":["界面","CSS","交互"],"cover":"124","summary":"这个站的首页照着游戏的标题画面来做：斜切的菜单按钮、硬阴影、斜着裁开的插画、能用方向键选的菜单，还有换页时扫过去的斜条。这一章记一下每样东西是怎么做的。","md":"开站当天，这个站就换了三次样子。现在这一版照着游戏的标题画面来做：左边一块斜纹面板放菜单，右边一张插画，底下滚着一条新闻栏。\n\n游戏界面有很多现成的规矩，照着做，页面就有了自己的样子。\n\n## 斜切按钮\n\n菜单按钮是平行四边形。直接对按钮用 `skewX`，里面的字也会被拉斜，所以要在子元素上再斜回来：\n\n```css\n.btn { transform: skewX(-14deg); }\n.btn > * { transform: skewX(14deg); }\n```\n\n外框斜了，字还是正的。四个按钮每个往右多缩进 18px，排出来是一道斜着的台阶，和插画的斜边差不多平行。\n\n## 硬阴影\n\n这里的阴影都不带模糊：`box-shadow: 6px 6px 0 #1d2142`。看起来像贴纸，而不是飘在空中的卡片。\n\n按下去的时候，让按钮往阴影的方向挪一点，同时把阴影缩短，就像真的被压下去了：\n\n```css\n.btn:active {\n  transform: skewX(-14deg) translate(4px, 4px);\n  box-shadow: 2px 2px 0 #1d2142;\n}\n```\n\n下面可以调角度、阴影和边框，按一下试试手感：\n\n\u003cdiv class=\"demo\" data-demo=\"skew\">\u003c/div>\n\n## 斜着裁开的插画\n\n标题画面右边的插画用 `clip-path` 裁成梯形，左边的斜纹面板也是：\n\n```css\n.art   { clip-path: polygon(17% 0, 100% 0, 100% 100%, 0 100%); }\n.panel { clip-path: polygon(0 0, 100% 0, 70% 100%, 0 100%); }\n```\n\n两条斜边很难刚好对齐，对不齐中间就会露出一条缝。我的做法是让面板盖住插画的左边一截，屏幕上看到的斜边只有面板那一条，插画自己的斜边藏在面板底下。\n\n> [!tip]\n> `clip-path` 会连焦点框一起裁掉。被裁过的链接要另外给一个焦点样式，比如换个背景色，不然用键盘的人看不出焦点在哪。\n\n## 用方向键选菜单\n\n游戏的菜单可以用方向键选，这里也一样：在标题画面按 \u003ckbd>↑\u003c/kbd> \u003ckbd>↓\u003c/kbd> 换选项，\u003ckbd>Enter\u003c/kbd> 确定。鼠标移上去也会选中，所以不管用哪种方式，高亮的都是同一个按钮。\n\n方向键只在标题画面还在屏幕上的时候归菜单管。往下滚到最新章节以后，方向键还是用来滚动页面。\n\n## 换页的斜条\n\n换页时，一条粉色的斜条从左边扫到右边，内容在它盖满屏幕的那一刻换掉。斜条比屏幕宽一倍，因为斜过来以后，左上角和右下角会空出两个三角。\n\n如果系统设置了「减少动态效果」，或者在 CONFIG 里关掉了动效，就不播斜条，直接换页。滚动的新闻栏和标题画面的视差也一起停下。\n\n## 还没做的\n\n- 看板娘。等有一张满意的图再放上来。\n- 背景音乐。大概不会做，网页突然出声挺吓人的。\n"},{"slug":"november-joys","title":"十一月的小确幸清单","date":"2026-11-03T23:10","cat":"life","tags":["随笔","秋天","清单"],"cover":"435","summary":"天气转凉的时候，适合列一张小小的清单，记下那些能让心情变好的小事。","md":"十一月是一年里我最喜欢的月份之一：不算太冷，银杏还挂在树上，空气里有一点烤红薯的味道。\n\n天气一凉，人就容易懒。所以我给自己列了一张「小确幸清单」，不追求什么意义，做到一件就划掉一件。\n\n## 清单\n\n- [ ] 找一个晴天，沿着有银杏的那条路慢慢走一趟\n- [ ] 挑一个以前没做成的想法，这次真的把它做出来\n- [ ] 把冬天的毛毯从柜子里拿出来晒一晒\n- [ ] 读完一本放了很久的书\n- [ ] 给很久没联系的朋友发一句「最近好吗」\n- [ ] 某个周末什么都不安排，睡到自然醒\n\n> [!note]\n> 这里的勾选只保存在你自己的浏览器里，拿来当你自己的清单也可以。\n\n![银杏、咖啡和秋天](cg:887)\n\n## 为什么要写下来\n\n小事之所以叫小事，就是因为它们太容易被忘掉。写下来之后，它们就从「有空再说」变成了「今天就可以做的一件事」。\n\n而且，划掉一行的感觉真的很好。\n\n## 你的十一月\n\n如果你也有想在这个月做的小事，不妨也列一张清单。不用很长，三五行就够了。\n\n天冷了，记得多穿一点。\n"},{"slug":"loupe-toggle","title":"放大镜现在可以关掉了","date":"2026-11-05T18:43","cat":"design","tags":["更新","图鉴","交互"],"cover":"pc326","summary":"收到一条反馈：看大图时放大镜总跟着鼠标跑，有时只想安静地看整张图。现在大图查看器里多了一个开关，按 L 也行，选择会记住。","md":"收到一条反馈：放大镜挺好玩的，可有时候只想安安静静看整张图，鼠标一挪上去就冒出一个圆圈，有点挡视线。\n\n说得对。放大镜是我做图鉴时最得意的小功能，但「好玩」不等于「每次都想要」。所以现在它可以关掉了。\n\n## 怎么开关\n\n- **大图查看器里**：右边栏多了一个「放大镜：开 / 关」按钮，点一下就切换。\n- **键盘**：看大图的时候按 \u003ckbd>L\u003c/kbd>。\n- **设置**：右上角「设置」里也有一行「放大镜」。\n- **索引**：按 \u003ckbd>Ctrl\u003c/kbd> \u003ckbd>K\u003c/kbd>（Mac 上是 \u003ckbd>⌘\u003c/kbd> \u003ckbd>K\u003c/kbd>），搜「放大镜」。\n\n选好以后会记在这台设备上，下次打开还是同样的状态。\n\n## 手机上顺便更顺手了\n\n手机上看大图时，放大镜是「按住图片」才出现的。以前为了不和放大镜抢手势，左右滑动换图只能在图片外面滑。\n\n现在把放大镜关掉以后，**整张图上都可以左右滑**，翻图鉴会顺手很多。想看细节了，再打开就好。\n\n## 试一试\n\n点下面这张图打开大图，看看右边栏的开关：\n\n![红叶里的少女，叶脉和光斑很适合用放大镜看](cg:pc92)\n\n> [!tip]\n> 放大镜开着的时候，用它看一次细节，还能解锁成就「细节控」。\n\n谢谢提建议的朋友。以后有什么想法，也欢迎继续告诉我。\n"}]}</script><script src="lib/marked/12.0.2/marked.min.js?v=c74cc468"></script><script src="lib/dompurify/3.1.6/purify.min.js?v=2230c2d4"></script><script src="lib/highlight.js/11.9.0/highlight.min.js?v=6324f32b"></script><script id="nyx-js">var NYX_PW_SVG={D:'<svg width="18" height="20" vie
